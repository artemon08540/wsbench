[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wsbench"
version = "0.1.0"
description = "Порівняльний аналіз методів автоматизованого збору даних із динамічних веб-ресурсів"
requires-python = ">=3.11"

[project.scripts]
wsbench = "wsbench.ui.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
